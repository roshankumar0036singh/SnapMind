name: SnapMind AI Tests

on:
  push:
    paths:
      - 'snapmind-ai/**'
      - '.github/workflows/snapmind-ai-test.yml'
  pull_request:
    paths:
      - 'snapmind-ai/**'
      - '.github/workflows/snapmind-ai-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: snapmind-ai/package-lock.json

      - name: Install dependencies
        working-directory: snapmind-ai
        run: npm ci

      - name: Run tests
        working-directory: snapmind-ai
        run: npm test

      - name: Verify CLI boots
        working-directory: snapmind-ai
        run: node src/index.js --version
