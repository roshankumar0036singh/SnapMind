name: Space Heartbeat

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hugging Face Space
        run: |
          # Ping your Cloudflare Worker URL instead of direct HF Space
          # The Worker will automatically add the HF_TOKEN for you.
          curl -f -s https://snapmind-gateway.roshankumar30080.workers.dev/api/v1/health || echo "Ping failed"
