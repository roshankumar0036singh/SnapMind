appId: com.snapmind.desktop
productName: SnapMind
directories:
  output: dist_electron
  buildResources: build
files:
  - dist/**/*
  - electron/**/*
  - package.json
win:
  target:
    - nsis
    - portable
  icon: src/assets/icon.png
mac:
  target:
    - dmg
    - zip
  icon: src/assets/icon.png
  category: public.app-category.productivity
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: SnapMind
publish:
  provider: github
  owner: roshankumar0036singh
  repo: SnapMind
