[project]
name = "snapmind-mcp"
version = "0.1.0"
description = "MCP server for SnapMind RAG backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
]

[project.scripts]
snapmind-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
