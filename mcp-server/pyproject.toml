[project]
name = "snapmind-mcp"
version = "1.0.0"
description = "MCP server exposing the SnapMind RAG backend as tools and resources"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "SnapMind" }]
license = { text = "ISC" }
keywords = ["mcp", "rag", "ai", "llm", "knowledge-base", "vector-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: ISC License (ISCL)",
]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "anyio>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
snapmind-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
