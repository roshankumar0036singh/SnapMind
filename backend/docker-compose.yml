version: '3.8'

services:
  db:
      image: pgvector/pgvector:pg16
      container_name: snapmind_db
      environment:
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=password
        - POSTGRES_DB=snapmind
      ports:
        - "5432:5432"
      volumes:
        - db_data:/var/lib/postgresql/data

volumes:
  db_data:
